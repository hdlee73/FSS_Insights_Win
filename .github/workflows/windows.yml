name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            suffix: ""
          - arch: arm64
            runner: windows-11-arm
            suffix: "-arm64"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          architecture: ${{ matrix.arch }}
          cache: gradle

      - name: Unit tests
        run: ./gradlew.bat test --no-daemon --console=plain

      # ARM64 러너에는 MSI 패키징용 WiX 3 가 기본으로 없을 수 있어, 없으면 내려받아 PATH 에 추가한다.
      - name: Ensure WiX 3
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $zip = Join-Path $env:RUNNER_TEMP "wix314-binaries.zip"
            Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $zip
            $dir = Join-Path $env:RUNNER_TEMP "wix3"
            Expand-Archive $zip -DestinationPath $dir -Force
            $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Build Windows installer (MSI)
        env:
          NEWS_PROXY_URL: ${{ vars.NEWS_PROXY_URL }}
          NEWS_PROXY_TOKEN: ${{ secrets.NEWS_PROXY_TOKEN }}
        run: ./gradlew.bat packageMsi --no-daemon --console=plain

      - name: Read app version
        shell: pwsh
        run: |
          $line = Select-String -Path build.gradle.kts -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $line) { throw "build.gradle.kts 에서 version 을 찾지 못했습니다." }
          "VERSION=$($line.Matches[0].Groups[1].Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare release files
        shell: pwsh
        run: |
          $msi = Get-ChildItem build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI 파일을 찾지 못했습니다." }
          $asset = "fss-insights-windows${{ matrix.suffix }}-v$env:VERSION.msi"
          Copy-Item $msi.FullName $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Out-File -Encoding ascii "$asset.sha256"
          Get-Item $asset, "$asset.sha256" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: fss-insights-windows-${{ matrix.arch }}
          path: |
            fss-insights-windows${{ matrix.suffix }}-v${{ env.VERSION }}.msi
            fss-insights-windows${{ matrix.suffix }}-v${{ env.VERSION }}.msi.sha256

  publish:
    needs: build
    # ARM64 빌드가 실패해도 x64 설치 파일은 올릴 수 있도록 build 결과 전체를 요구하지 않는다.
    if: ${{ !cancelled() && needs.build.result != 'cancelled' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: fss-insights-windows-*
          path: dist
          merge-multiple: true

      - name: Read app version
        run: |
          VERSION=$(grep -m1 -E '^version = "' build.gradle.kts | sed -E 's/version = "([^"]+)"/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -l dist

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file RELEASE_NOTES.md
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "FSS Insights for Windows v$VERSION" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Publish test build (pre-release, not a version release)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --cleanup-tag --yes 2>/dev/null || true
          gh release create test-build dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "테스트 빌드 (정식 릴리스 아님)" \
            --notes "브랜치 $GITHUB_REF_NAME 의 테스트용 설치 파일입니다. x64용과 ARM64용(-arm64)이 있으며, 기존 앱 위에 설치하면 업데이트됩니다."
